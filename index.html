<!DOCTYPE html> 
<html> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>SOS</title> 
<style> 
body{ 
  font-family:Calibri,Arial; 
  background:#f5f6f7; 
  padding:30px; 
  max-width:900px; 
  margin:auto; 
  line-height:1.7; 
} 
@media (max-width:600px){
  body{padding:10px;font-size:18px;} 
  #illust{width:100%;height:auto;} 
  button{width:100%;font-size:18px;} 
  .excelTable{width:100%;font-size:16px;} 
  input{width:100%;margin-bottom:10px;font-size:18px;} 
}

/* 絵のエリア */
#illust{ 
  width:420px; 
  height:260px; 
  margin-bottom:25px; 
  border:2px solid #c0c0c0; 
  box-shadow:0 2px 6px rgba(0,0,0,0.2); 
  border-radius:8px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  background:#fff;
}
#illust svg{ position:absolute; top:0; left:0; width:100%; height:180px; transition:opacity 0.3s; }
.hidden{ opacity:0; pointer-events:none; }

#tapResult{
  position:absolute;
  bottom:0;
  width:100%;
  height:80px;
  background:#f0f8ff;
  border-top:1px solid #c0c0c0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:bold;
  color:#217346;
}

.hint{
  position:absolute; top:5px; right:10px;
  font-size:12px; background:rgba(0,0,0,0.4); color:white;
  padding:2px 8px; border-radius:12px; z-index:10;
}

/* 入力フォーム */
.inputBox{ background:white; padding:20px; margin-bottom:20px; box-shadow:0 3px 8px rgba(0,0,0,0.15); border-radius:8px;} 
input{ padding:8px; margin-right:10px; border:1px solid #ccc; border-radius:4px;} 

/* Excel風 */
.excelTable{ border-collapse:collapse; background:white; box-shadow:0 3px 8px rgba(0,0,0,0.15); border-radius:8px; overflow:hidden;} 
.excelTable th{ background:#217346; color:white; padding:10px; border:1px solid #c6c6c6; } 
.excelTable td{ border:1px solid #d9d9d9; padding:10px; text-align:center; } 
.rowIndex{ background:#f3f3f3; font-weight:bold; } 

button{ background:#217346; color:white; border:none; padding:10px 18px; cursor:pointer; border-radius:4px; margin-top:10px; } 
button:hover{ background:#1a5c38; }
#result{ margin-top:15px; font-weight:bold; color:#333; } 
</style> 
</head> 
<body> 
<h1>Whale – Plankton Economic Model</h1> 

<!-- 絵: タップで切り替え + 結果表示 -->
<div id="illust" onclick="handleTap()">
  <!-- 1. クジラ -->
  <svg id="svg0" viewBox="0 0 420 180">
    <defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#cceeff"/></linearGradient></defs>
    <rect width="420" height="180" fill="url(#sea)"/>
    <g fill="#7ED957"><circle cx="80" cy="140" r="3"/><circle cx="110" cy="138" r="3"/><circle cx="270" cy="145" r="3"/></g>
    <ellipse cx="210" cy="100" rx="90" ry="35" fill="#4A90E2"/>
    <ellipse cx="295" cy="95" rx="25" ry="20" fill="#4A90E2"/>
    <circle cx="270" cy="90" r="4" fill="white"/><circle cx="270" cy="90" r="2" fill="black"/>
    <path d="M130 100 Q100 80 90 110 Q100 120 130 100" fill="#3A7BD5"/>
    <text x="210" y="165" text-anchor="middle" font-size="14" fill="#333">Whale - S1</text>
  </svg>

  <!-- 2. 鳥 -->
  <svg id="svg1" viewBox="0 0 420 180" class="hidden">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#87CEEB"/><stop offset="100%" stop-color="#ffffff"/></linearGradient></defs>
    <rect width="420" height="180" fill="url(#sky)"/>
    <circle cx="80" cy="40" r="25" fill="#FFD700" opacity="0.8"/>
    <path d="M150 70 Q160 60 170 70 Q160 80 150 70" fill="#333"/>
    <path d="M210 60 Q220 50 230 60 Q220 70 210 60" fill="#333"/>
    <path d="M270 75 Q280 65 290 75 Q280 85 270 75" fill="#333"/>
    <text x="210" y="165" text-anchor="middle" font-size="14" fill="#333">Bird - S2</text>
  </svg>

  <!-- 3. ライオン -->
  <svg id="svg2" viewBox="0 0 420 180" class="hidden">
    <defs><linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F4E4BC"/><stop offset="100%" stop-color="#D2B48C"/></linearGradient></defs>
    <rect width="420" height="180" fill="url(#ground)"/>
    <circle cx="210" cy="90" r="50" fill="#FFB347"/>
    <circle cx="210" cy="90" r="70" fill="#CD853F" opacity="0.6"/>
    <circle cx="190" cy="80" r="5" fill="black"/><circle cx="230" cy="80" r="5" fill="black"/>
    <ellipse cx="210" cy="95" rx="8" ry="5" fill="black"/>
    <text x="210" y="165" text-anchor="middle" font-size="14" fill="#333">Lion - S</text>
  </svg>

  <div id="tapResult">絵をタップして計算</div>
  <div class="hint">タップで次へ</div>
</div> 

<!-- 入力フォーム -->
<div class="inputBox"> 
<h2>INPUT</h2> 
<label>B</label><br> 
<input type="number" id="B" value="100"><br> 
<label>O1</label><br> 
<input type="number" id="O1" value="10"><br> 
<label>O2</label><br> 
<input type="number" id="O2" value="20"><br> 
<label>T</label><br> 
<input type="number" id="T" value="2"><br> 
<button onclick="myFunc()">CALCULATE</button> 
<div id="result"></div> 
</div> 

<div id="table"></div> 

<script> 
var currentIllust = 0;
var totalIllust = 3;

function calcValues(){
  var B=Number(document.getElementById("B").value); 
  var O1=Number(document.getElementById("O1").value); 
  var O2=Number(document.getElementById("O2").value); 
  var T=Number(document.getElementById("T").value); 
  
  var S1=B-O1*T; 
  var S2=B-O2*T; 
  var S=B-O1-O2; 
  return {B:B,O1:O1,O2:O2,S1:S1,S2:S2,S:S};
}

/* 絵タップ時の処理 */
function handleTap(){
  var vals = calcValues();
  var resultText = "";

  // 絵を切り替え
  document.getElementById("svg"+currentIllust).classList.add("hidden");
  currentIllust = (currentIllust + 1) % totalIllust;
  document.getElementById("svg"+currentIllust).classList.remove("hidden");

  // 表示する結果を決める
  if(currentIllust === 0){ // クジラ
    resultText = "→タップした→ S1 = " + vals.S1;
  }else if(currentIllust === 1){ // 鳥
    resultText = "→絵をタップ→ S2 = " + vals.S2;
  }else{ // ライオン
    resultText = "→一覧表の4 → S = " + vals.S;
    showTable(vals.B, vals.O1, vals.O2, vals.S); // ここで表も更新
  }
  document.getElementById("tapResult").innerHTML = resultText;
}

/* CALCULATEボタン */
function myFunc(){ 
  var vals = calcValues();
  document.getElementById("result").innerHTML= "S1 = "+vals.S1+"<br>S2 = "+vals.S2; 
  showTable(vals.B, vals.O1, vals.O2, vals.S); 
} 

/* テーブル表示 */
function showTable(B,O1,O2,S){ 
  var table="<table class='excelTable'>"; 
  table+="<tr><th></th><th>項目</th><th>値</th></tr>"; 
  table+="<tr><td class='rowIndex'>1</td><td>B</td><td>"+B+"</td></tr>"; 
  table+="<tr><td class='rowIndex'>2</td><td>O1</td><td>"+O1+"</td></tr>"; 
  table+="<tr><td class='rowIndex'>3</td><td>O2</td><td>"+O2+"</td></tr>"; 
  table+="<tr><td class='rowIndex'>4</td><td>S=B-O1-O2</td><td>"+S+"</td></tr>"; 
  table+="</table>"; 
  document.getElementById("table").innerHTML=table; 
} 
</script> 
</body> 
</html>
